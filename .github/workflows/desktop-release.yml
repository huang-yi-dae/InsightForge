name: Desktop Release

# 打 v* tag 时触发：在 mac / windows / linux 上分别构建 Tauri 安装包，
# 并汇总到一个 GitHub Release。前端为 Next.js 静态导出（npm run desktop:export）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      # 用源图标生成各平台完整图标集，覆盖仓库内的占位图标，保证 macOS .icns 规范。
      - name: Generate app icons
        run: npx --yes @tauri-apps/cli@latest icon src-tauri/app-icon.png

      - name: Build desktop app and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InsightForge ${{ github.ref_name }}"
          releaseBody: "跨平台桌面客户端安装包。BYOK 前端直连，数据留在本地。"
          # 直接发布到正式 Release（不再用 draft），避免同一 tag 出现
          # “空的已发布 release” 与 “装着产物的 draft” 两个对象并存。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
